name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check strategy and agent
        run: |
          python -m py_compile freqtrade/user_data/strategies/DonchianBreakout.py
          python -m py_compile freqtrade/agent/main.py freqtrade/agent/tools/*.py
